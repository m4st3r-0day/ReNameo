name: Release

# Push a tag like v1.1.0 to publish the macOS app as a GitHub release, with the notes of that version from CHANGELOG.md.
# The tag must match application.version in app.properties.
#
# Run it by hand (Actions > Release > Run workflow) to build Linux and Windows packages for testing: they are
# only attached to the run, nothing is published. The Docker image is pushed to ghcr.io only if you tick it.
#
# API keys are never built into these packages: users enter their own on first start (or via TMDB_API_KEY and friends).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      linux:
        description: "Build the Linux package (.deb) for testing"
        type: boolean
        default: true
      windows:
        description: "Build the Windows installer (.msi) for testing"
        type: boolean
        default: true
      docker:
        description: "Build and PUBLISH the Docker image on ghcr.io"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Version
        id: version
        run: |
          VERSION="$(sed -n 's/^application.version:[[:space:]]*//p' app.properties)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match application.version $VERSION in app.properties"
            exit 1
          fi
      - run: tools/ci-setup-ant.sh
      - run: ant -lib "$IVY_JAR" resolve fatjar
      - run: tools/make-app.sh
      - name: Name the files after the version
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p out
          mv dist/ReNameo-mac-arm64.dmg "out/ReNameo-$V-mac-arm64.dmg"
          mv dist/ReNameo-mac-arm64.zip "out/ReNameo-$V-mac-arm64.zip"
          (cd out && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/*

  linux:
    if: github.event_name == 'workflow_dispatch' && inputs.linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot
      - run: tools/ci-setup-ant.sh
      - run: ant -lib "$IVY_JAR" resolve fatjar
      - run: tools/package.sh deb
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/packages/*

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: tools/ci-setup-ant.sh
      - run: ant -lib "$IVY_JAR" resolve fatjar
      - run: tools/package.sh msi
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/packages/*.msi

  docker:
    if: github.event_name == 'workflow_dispatch' && inputs.docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^application.version:[[:space:]]*//p' app.properties)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/renameo:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/renameo:latest

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: out
      - name: Release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          # the section of this version, without its heading
          awk -v v="$V" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No section for $V in CHANGELOG.md"
            exit 1
          fi
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: ReNameo ${{ github.ref_name }} for macOS
          body_path: notes.md
          files: out/*
