name: Release

# Push a tag like v1.1.0 to build all packages and publish them as a GitHub release,
# plus the Docker image on ghcr.io. API keys are never built into public packages:
# users enter their own on first start (or via TMDB_API_KEY and friends).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: tools/ci-setup-ant.sh
      - run: ant -lib "$IVY_JAR" resolve fatjar
      - run: tools/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/ReNameo-mac-arm64.dmg
            dist/ReNameo-mac-arm64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot
      - run: tools/ci-setup-ant.sh
      - run: ant -lib "$IVY_JAR" resolve fatjar
      - run: tools/package.sh deb
      - run: cp dist/ReNameo_1.0.0.jar dist/packages/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/packages/*

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: tools/ci-setup-ant.sh
      - run: ant -lib "$IVY_JAR" resolve fatjar
      - run: tools/package.sh msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/packages/*.msi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/renameo
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, linux, windows, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
