name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Ant and Ivy
        run: tools/ci-setup-ant.sh

      - name: Resolve dependencies
        run: ant -lib "$IVY_JAR" resolve

      - name: Build
        run: ant -lib "$IVY_JAR" fatjar

      - name: Test
        run: tools/run-tests.sh

      - name: Command line smoke test
        run: java -jar dist/ReNameo_1.0.0.jar -version
